workflows:
  android-workflow:
    name: Android CI & Quality Gate
    instance_type: linux_x2
    max_build_duration: 30
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Install dependencies
        script: |
          flutter packages pub get
      - name: Flutter Analyze (Code Quality Gate)
        script: |
          flutter analyze lib/ test/unit_test test/widget_test
      - name: Run Unit & Widget Tests
        script: |
          flutter test test/unit_test test/widget_test
      - name: Build Android Debug APK
        script: |
          flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients: []
